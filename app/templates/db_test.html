<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aiven MySQL 테스트</title>
    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
            background: #f5f6f8;
            color: #172033;
            font: 1rem/1.5 system-ui, sans-serif;
        }

        main {
            max-width: 34rem;
            margin: 0 auto;
            padding: 1.5rem;
            border: 1px solid #dbe0e8;
            border-radius: 1rem;
            background: white;
        }

        a { color: #2054af; }
        h1 { margin: .75rem 0; }
        label { display: block; margin-bottom: .4rem; }
        .add-field { display: flex; gap: .5rem; }
        input, button { padding: .55rem .75rem; border-radius: .5rem; font: inherit; }
        input { min-width: 0; flex: 1; border: 1px solid #8492a8; }
        button { border: 1px solid #2054af; background: #2054af; color: white; cursor: pointer; }
        .delete { border-color: #b13e3e; background: white; color: #8f2929; }
        table { width: 100%; margin-top: 1.25rem; border-collapse: collapse; text-align: left; }
        th, td { padding: .55rem .5rem; border-bottom: 1px solid #dbe0e8; }
        td:nth-child(2) { width: 100%; overflow-wrap: anywhere; }
        .error { padding: .75rem; border-radius: .5rem; background: #fff1f1; color: #8f2929; }
    </style>
</head>
<body>
    <main>
        <a href="{{ url_for('upload_page').path }}">사진 업로드 테스트</a>
        <h1>Aiven MySQL 테스트</h1>
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        <a href="{{ url_for('db_test_page').path }}">다시 불러오기</a>
        {% else %}
        <form method="post" action="{{ url_for('add_db_test_item').path }}">
            <label for="item-name">항목 이름</label>
            <div class="add-field">
                <input id="item-name" name="name" maxlength="{{ max_name_length }}" required>
                <button type="submit">추가</button>
            </div>
        </form>

        {% if items %}
        <table aria-label="테스트 항목 목록">
            <thead>
                <tr><th scope="col">ID</th><th scope="col">이름</th><th scope="col">작업</th></tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>
                        <form method="post" action="{{ url_for('delete_db_test_item', item_id=item.id).path }}">
                            <button class="delete" type="submit" aria-label="항목 {{ item.id }} 삭제">삭제</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p>저장된 테스트 항목이 없어요.</p>
        {% endif %}
        {% endif %}
    </main>
</body>
</html>
