<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사진 업로드 테스트</title>
    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
            background: #f5f6f8;
            color: #172033;
            font: 1rem/1.5 system-ui, sans-serif;
        }

        main {
            max-width: 34rem;
            margin: 0 auto;
            padding: 1.5rem;
            border: 1px solid #dbe0e8;
            border-radius: 1rem;
            background: white;
        }

        h1 { margin-top: 0; }
        input { display: block; max-width: 100%; margin: .5rem 0 1rem; }
        button {
            padding: .65rem 1rem;
            border: 0;
            border-radius: .5rem;
            background: #2054af;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        button:disabled { opacity: .65; cursor: wait; }
        img { display: block; max-width: 100%; max-height: 24rem; margin: 1rem 0; }
        code { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <h1>사진 업로드 테스트</h1>
        <p id="file-help">JPEG, PNG, WebP 사진 한 장을 선택하세요. 최대 {{ max_size_mb }}MB까지 올릴 수 있어요.</p>
        <form id="upload-form" action="{{ url_for('upload_image').path }}" method="post" enctype="multipart/form-data">
            <label for="image-file">사진 파일</label>
            <input id="image-file" type="file" name="file" accept="{{ accepted_types }}" aria-describedby="file-help" required>
            <button type="submit">업로드</button>
        </form>

        <p id="upload-status" role="status"></p>
        <section id="upload-result" hidden>
            <img id="uploaded-image" alt="업로드한 사진">
            <p>저장 경로 <code id="image-path"></code></p>
            <a id="image-link" target="_blank" rel="noopener noreferrer">새 탭에서 사진 열기</a>
        </section>
    </main>

    <script>
        const form = document.querySelector('#upload-form');
        const button = form.querySelector('button');
        const status = document.querySelector('#upload-status');
        const result = document.querySelector('#upload-result');
        const image = document.querySelector('#uploaded-image');
        const imagePath = document.querySelector('#image-path');
        const imageLink = document.querySelector('#image-link');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            result.hidden = true;
            status.textContent = '사진을 업로드하는 중이에요.';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                });
                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    status.textContent = typeof data?.detail === 'string'
                        ? data.detail
                        : `업로드에 실패했어요. (HTTP ${response.status})`;
                    return;
                }

                image.src = data.url;
                imageLink.href = data.url;
                imagePath.textContent = data.path;
                result.hidden = false;
                status.textContent = '사진을 업로드했어요.';
            } catch {
                status.textContent = '업로드 결과를 확인할 수 없어요. 서버가 실행 중인지 확인해 주세요.';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
